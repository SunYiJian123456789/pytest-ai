# shopping 后端接口清单 —— 覆盖率基准（机器可读版）
#
# 说明：接口说明与「已知行为」见同目录的 接口清单.md，这份只保留覆盖率计算需要的字段。
# 覆盖率不是按本文件里的 covered_by 推断的，而是运行期由 ApiClient 上报的真实请求统计：
# 本文件的 covered_by 只是「这条接口应该由哪些用例负责」的人工约定，用于发现责任空缺。
#
# 字段：
#   method      HTTP 方法（大写）
#   path        路径，动态段用 {id}，静态文件名用 {file}（与 framework.coverage 的归一化一致）
#   group       分组，只影响覆盖率表的分节
#   name        一句话说明
#   covered_by  预期覆盖这条接口的用例文件（可多个）
version: 1

endpoints:
  # ---------- 用户端：无需登录 ----------
  - method: GET
    path: /api/health
    group: 用户端（公开）
    name: 健康检查（状态 / 数据库 / 图片存储）
    covered_by: [test_01_health.py]

  - method: GET
    path: /api/home
    group: 用户端（公开）
    name: 首页聚合：轮播、分类、热门、秒杀、促销
    covered_by: [test_03_catalog.py]

  - method: GET
    path: /api/banners
    group: 用户端（公开）
    name: 轮播图列表
    covered_by: [test_03_catalog.py]

  - method: GET
    path: /api/categories
    group: 用户端（公开）
    name: 商品分类列表
    covered_by: [test_03_catalog.py, test_08_admin_stats.py]

  - method: GET
    path: /api/promotions
    group: 用户端（公开）
    name: 促销活动列表
    covered_by: [test_03_catalog.py]

  - method: GET
    path: /api/products
    group: 用户端（公开）
    name: 商品列表，支持 categoryId / keyword / sort
    covered_by: [test_03_catalog.py, test_04_search.py]

  - method: GET
    path: /api/products/{id}
    group: 用户端（公开）
    name: 商品详情（下架商品返回 404）
    covered_by: [test_03_catalog.py, test_09_admin_products.py]

  - method: GET
    path: /api/search/suggest
    group: 用户端（公开）
    name: 搜索联想，limit 钳制到 1–10
    covered_by: [test_04_search.py]

  - method: POST
    path: /api/auth/register
    group: 用户端（公开）
    name: 注册并直接返回登录态
    covered_by: [test_02_user_auth.py]

  - method: POST
    path: /api/auth/login
    group: 用户端（公开）
    name: 用户登录
    covered_by: [test_02_user_auth.py]

  - method: POST
    path: /api/upload
    group: 用户端（公开）
    name: 图片上传，落盘后返回 /images/xxx
    covered_by: [test_12_upload.py]

  - method: GET
    path: /images/{file}
    group: 用户端（公开）
    name: 本地图片静态回源
    covered_by: [test_12_upload.py]

  # ---------- 用户端：需用户 token ----------
  - method: GET
    path: /api/auth/me
    group: 用户端（用户 token）
    name: 当前登录用户
    covered_by: [test_02_user_auth.py, test_16_idor.py, test_18_auth_negative.py]

  - method: POST
    path: /api/auth/logout
    group: 用户端（用户 token）
    name: 用户登出，token 立即失效
    covered_by: [test_02_user_auth.py]

  - method: GET
    path: /api/cart
    group: 用户端（用户 token）
    name: 购物车列表
    covered_by: [test_05_cart.py, test_16_idor.py]

  - method: POST
    path: /api/cart/add
    group: 用户端（用户 token）
    name: 加入购物车（同商品累加数量）
    covered_by: [test_05_cart.py]

  - method: PUT
    path: /api/cart/{id}
    group: 用户端（用户 token）
    name: 修改数量，quantity<=0 即移除
    covered_by: [test_05_cart.py, test_16_idor.py]

  - method: DELETE
    path: /api/cart/{id}
    group: 用户端（用户 token）
    name: 删除单个购物车项（幂等）
    covered_by: [test_05_cart.py, test_16_idor.py, test_17_idempotency.py]

  - method: DELETE
    path: /api/cart
    group: 用户端（用户 token）
    name: 清空购物车
    covered_by: [test_05_cart.py, test_16_idor.py]

  - method: POST
    path: /api/pay
    group: 用户端（用户 token）
    name: 虚拟支付，amount 可覆盖真实合计
    covered_by: [test_06_payment.py, test_16_idor.py, test_17_idempotency.py]

  - method: GET
    path: /api/pay/records
    group: 用户端（用户 token）
    name: 最近支付记录（默认 limit=8，最多 50）
    covered_by: [test_06_payment.py, test_16_idor.py]

  # ---------- 管理端：独立鉴权 ----------
  - method: POST
    path: /api/admin/auth/login
    group: 管理端（管理 token）
    name: 管理员登录，返回 adm_ 前缀 token
    covered_by: [test_07_admin_auth.py]

  - method: GET
    path: /api/admin/auth/me
    group: 管理端（管理 token）
    name: 当前管理员
    covered_by: [test_07_admin_auth.py]

  - method: POST
    path: /api/admin/auth/logout
    group: 管理端（管理 token）
    name: 管理员登出
    covered_by: [test_07_admin_auth.py]

  - method: GET
    path: /api/admin/stats
    group: 管理端（管理 token）
    name: 概览统计、待审数、最近操作
    covered_by: [test_08_admin_stats.py]

  - method: GET
    path: /api/admin/products
    group: 管理端（管理 token）
    name: 商品分页（keyword / categoryId / status / sort / page / pageSize）
    covered_by: [test_08_admin_stats.py, test_09_admin_products.py, test_19_pagination.py, test_20_input_bounds.py]

  - method: GET
    path: /api/admin/products/{id}
    group: 管理端（管理 token）
    name: 商品详情（含下架）
    covered_by: [test_09_admin_products.py]

  - method: POST
    path: /api/admin/products
    group: 管理端（管理 token）
    name: 提交新增申请，只写 product_approval
    covered_by: [test_09_admin_products.py, test_11_admin_approvals.py, test_20_input_bounds.py]

  - method: PUT
    path: /api/admin/products/{id}
    group: 管理端（管理 token）
    name: 编辑商品，立即影响前台
    covered_by: [test_09_admin_products.py]

  - method: PATCH
    path: /api/admin/products/{id}/status
    group: 管理端（管理 token）
    name: 上架 / 下架
    covered_by: [test_09_admin_products.py]

  - method: DELETE
    path: /api/admin/products/{id}
    group: 管理端（管理 token）
    name: 删除商品并清理购物车引用
    covered_by: [test_09_admin_products.py]

  - method: POST
    path: /api/admin/products/batch-status
    group: 管理端（管理 token）
    name: 批量上下架
    covered_by: [test_09_admin_products.py]

  - method: POST
    path: /api/admin/products/batch-delete
    group: 管理端（管理 token）
    name: 批量删除
    covered_by: [test_09_admin_products.py]

  - method: GET
    path: /api/admin/categories
    group: 管理端（管理 token）
    name: 分类列表（含 productCount）
    covered_by: [test_10_admin_categories.py]

  - method: POST
    path: /api/admin/categories
    group: 管理端（管理 token）
    name: 新增分类
    covered_by: [test_10_admin_categories.py]

  - method: PUT
    path: /api/admin/categories/{id}
    group: 管理端（管理 token）
    name: 编辑分类
    covered_by: [test_10_admin_categories.py]

  - method: DELETE
    path: /api/admin/categories/{id}
    group: 管理端（管理 token）
    name: 删除分类（有商品时拒绝）
    covered_by: [test_10_admin_categories.py]

  - method: GET
    path: /api/admin/approvals
    group: 管理端（管理 token）
    name: 申请单分页（status / scope=mine / keyword）
    covered_by: [test_11_admin_approvals.py, test_19_pagination.py]

  - method: GET
    path: /api/admin/approvals/pending-count
    group: 管理端（管理 token）
    name: 待审数量
    covered_by: [test_11_admin_approvals.py]

  - method: POST
    path: /api/admin/approvals/{id}/approve
    group: 管理端（管理 token）
    name: 他人审批通过，事务内写入 product
    covered_by: [test_11_admin_approvals.py]

  - method: POST
    path: /api/admin/approvals/{id}/reject
    group: 管理端（管理 token）
    name: 驳回（必须填 remark）
    covered_by: [test_11_admin_approvals.py]

  - method: POST
    path: /api/admin/approvals/{id}/cancel
    group: 管理端（管理 token）
    name: 申请人撤回
    covered_by: [test_11_admin_approvals.py]

  - method: DELETE
    path: /api/admin/approvals/{id}
    group: 管理端（管理 token）
    name: 删除申请单
    covered_by: [test_11_admin_approvals.py]
