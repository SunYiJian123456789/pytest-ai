# shopping 响应契约：服务方与消费方共用的结构约定。
#
# 消费方：testcases/test_14_contract.py 按契约名校验真实响应结构。
# 提供方：CI 用 git HEAD 版本作基线，跑 framework.contract check 拦截破坏性变更。
#   - 加可选字段、放宽约束 → 放行
#   - 删字段、改类型、加必填、收紧约束 → 失败
#
# 格式：version 固定 1；每条契约必须有 method / path / response（JSON Schema Draft 7）。
# token 字段仅作说明（需哪种角色），不参与校验；用例自己决定用哪个 token。
version: 1
project: shopping
contracts:
  health:
    method: GET
    path: /api/health
    token: null
    response:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, const: 200}
        message: {type: string}
        data:
          type: object
          required: [status, database]
          properties:
            status: {type: string, const: UP}
            database: {type: string, minLength: 1}

  categories:
    method: GET
    path: /api/categories
    token: null
    response:
      type: object
      required: [code, data]
      properties:
        code: {type: integer, const: 200}
        data:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, name, sortOrder]
            properties:
              id: {type: integer, minimum: 1}
              name: {type: string, minLength: 1}
              sortOrder: {type: integer, minimum: 0}

  user_me:
    method: GET
    path: /api/auth/me
    token: user
    response:
      type: object
      required: [code, data]
      properties:
        code: {type: integer, const: 200}
        data:
          type: object
          required: [id, username, nickname]
          properties:
            id: {type: integer, minimum: 1}
            username: {type: string, minLength: 1}
            nickname: {type: string}

  admin_stats:
    method: GET
    path: /api/admin/stats
    token: admin
    response:
      type: object
      required: [code, data]
      properties:
        code: {type: integer, const: 200}
        data:
          type: object
          required: [total, onSale, offSale, totalStock, categoryCount]
          properties:
            total: {type: integer, minimum: 0}
            onSale: {type: integer, minimum: 0}
            offSale: {type: integer, minimum: 0}
            totalStock: {type: integer, minimum: 0}
            categoryCount: {type: integer, minimum: 0}
