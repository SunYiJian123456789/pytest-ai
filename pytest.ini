[pytest]
# 默认执行 shopping 项目；切换项目时用 -o testpaths=projects/<项目名>/testcases
testpaths = projects/shopping/testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
markers =
    smoke: 核心链路冒烟用例
    auth: 登录与鉴权
    product: 商品与搜索
    cart: 购物车
    payment: 虚拟支付
    admin: 管理端
    approval: 新增商品审批流
    contract: 响应结构契约校验
    scenario: YAML 场景编排用例
    idor: 越权访问（IDOR）用例
filterwarnings =
    ignore::DeprecationWarning
    ignore::urllib3.exceptions.InsecureRequestWarning
