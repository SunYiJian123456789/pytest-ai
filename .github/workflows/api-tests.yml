name: Shopping API Tests

# 被测服务（Spring Boot + MySQL）由 D:/shopping 工程提供。
# 这里用 self-hosted runner，要求本机已按 README 启动 8080 与 3306。
#
# CI 分层：push / PR 只跑 smoke 快跑；定时任务与手动触发跑全量回归；
# 内核单测（framework/tests）不依赖被测服务，每次都跑。
# CI 环境 SHOPPING_DB_STRICT 自动生效：数据库不可用直接失败，不跑假全绿。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: '测试集：smoke 快跑或 full 全量'
        required: false
        default: full
        type: choice
        options: [smoke, full]
  schedule:
    - cron: '0 18 * * *'

jobs:
  api-tests:
    runs-on: self-hosted
    env:
      SHOPPING_DB_STRICT: '1'
      # A: self-hosted runner 上 PATH 里的 python 可能指向 WorkBuddy 内置解释器（缺依赖），
      #    统一显式指向已装好锁定版本依赖的 CPython 3.12。
      PYTHON: D:/python/python.exe
      # C: runner 从宿主继承的 PYTHONPATH 可能指向 WorkBuddy 的 safe-delete shim
      #    (sitecustomize.py)。它 hook 了 shutil.rmtree，pytest 结束清理临时目录时
      #    会触发批量删除保护，导致进程以退出码 1 结束——即便用例全部通过（run #6/#7 即此因）。
      #    显式清空以隔离宿主环境，让 pytest 使用原生删除。
      PYTHONPATH: ''

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth=1 时 HEAD^1 不存在，契约门禁会误判「首次提交」而跳过对比。
          # 完整历史保证基线提交与契约文件对象在本地可用；小仓库成本可忽略。
          fetch-depth: 0

      # .env 不进版本库，CI 从 .env.example 生成一份默认配置；
      # 这样顺带验证「样例文件是否完备」——样例缺键会在这里直接暴露。
      - name: Prepare .env from example
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            echo "已存在 .env，跳过生成"
          else
            cp .env.example .env
            echo "已从 .env.example 生成 .env（$(grep -c '^[A-Za-z_]' .env) 个键）"
          fi

      - name: Verify prerequisites
        shell: bash
        run: |
          # B: 严格失败——依赖安装失败必须让本步骤红，不能被后续成功的 curl 掩盖
          set -euo pipefail
          "$PYTHON" -m pip install -r requirements.txt -r requirements-dev.txt
          curl -sf http://127.0.0.1:8080/api/health || {
            echo "后端未启动：请先运行 D:/shopping/start-backend.bat"; exit 1;
          }

      - name: Lint (ruff)
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" -m ruff check .

      - name: Framework unit tests (no backend needed)
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" -m pytest framework/tests -o addopts= -q

      # 契约双向校验：消费方在 test_14_contract.py 按契约校验真实响应；
      # 这里做提供方门禁——与基线契约对比，删字段/改类型/加必填/收紧约束直接失败。
      # 新增可选字段、放宽约束放行。
      # 基线来源按事件区分：
      #   push / schedule / dispatch → HEAD^1（上一提交，需 checkout fetch-depth: 0）
      #   pull_request              → origin/<base_ref>（目标分支，避免只比对 PR 内部提交）
      # 拿不到基线必须显式告警并失败，不能再静默跳过造成「假绿」。
      - name: Contract compatibility (producer gate)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CONTRACT=projects/shopping/data/contracts.yaml
          "$PYTHON" -m framework.contract validate --file "$CONTRACT"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASELINE="origin/${BASE_REF}:${CONTRACT}"
            LABEL="origin/${BASE_REF}"
          else
            BASELINE="HEAD^1:${CONTRACT}"
            LABEL="HEAD^1"
          fi

          if ! git cat-file -e "$BASELINE" 2>/dev/null; then
            # fetch-depth: 0 保证历史完整，此时取不到基线只有两种可能：
            # ① 整个仓库真只有 1 个提交（首次提交）；② 基线提交里确实没有契约文件（契约首次引入）。
            # 其余情况（如 fetch-depth 退化）都按失败处理，杜绝静默假绿。
            COMMITS=$(git rev-list --count HEAD)
            if [ "$COMMITS" -le 1 ]; then
              echo "[contract] 仓库首次提交（$COMMITS 个提交），无基线可比，仅做格式自检" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! git cat-file -e "${LABEL}^{commit}" 2>/dev/null; then
              echo "::error::契约门禁基线提交 ${LABEL} 不存在（共 $COMMITS 个提交），疑似 fetch-depth 不足或分支异常，拒绝跳过" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            # 基线提交存在但契约文件首次引入：新增不算破坏，放行但要显式留痕。
            echo "[contract] 基线 ${LABEL} 中无契约文件（首次引入），跳过对比" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git show "$BASELINE" > /tmp/contract_baseline.yaml
          echo "[contract] 基线来源：$LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
          "$PYTHON" -m framework.contract check \
            --current "$CONTRACT" \
            --baseline /tmp/contract_baseline.yaml | tee -a "$GITHUB_STEP_SUMMARY"

      # xfail 台账门禁：收集阶段即可校验，不必等用例执行。
      # 「修好后端忘删 xfail」→ 台账 fixed 但标记还在；「删了标记忘改台账」→ 反向报错；
      # reason 不带缺陷号 → XPASS 时无法反查，同样判失败。
      - name: Known defects ledger (xfail vs ledger)
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" -m pytest --collect-only -q >/dev/null
          "$PYTHON" -m framework.defects \
            --project shopping --write reports/known_defects.md --check
          cat reports/known_defects.md >> "$GITHUB_STEP_SUMMARY"

      # push / PR / 手动选择 smoke → 快跑；定时 / 手动选择 full → 全量
      - name: Run smoke suite (push / PR)
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" -m pytest -m smoke -n 4

      - name: Run full suite (schedule / manual full)
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" -m pytest -n 4

      # 覆盖率由运行期真实请求统计，比对 data/api_inventory.yaml。
      # 双口径：触达（请求过）/ 有效（至少一次成功响应）；CI 门禁按有效口径。
      # 表格写进 Actions 运行页摘要；清单外请求一律判违规（负向用例路径走白名单）。
      # API_COVERAGE_MIN 由仓库变量设置；未设置时只出表不卡阈值，但仍检查清单外请求。
      - name: API coverage (inventory vs actual requests)
        if: always()
        shell: bash
        env:
          API_COVERAGE_MIN: ${{ vars.API_COVERAGE_MIN }}
          API_COVERAGE_METRIC: ${{ vars.API_COVERAGE_METRIC }}
        run: |
          set -euo pipefail
          if [ ! -f reports/api_coverage.md ]; then
            echo "未生成覆盖率报告（用例未运行，或项目未配置接口清单）"
            exit 0
          fi
          cat reports/api_coverage.md >> "$GITHUB_STEP_SUMMARY"
          METRIC="${API_COVERAGE_METRIC:-effective}"
          if [ -n "$API_COVERAGE_MIN" ]; then
            "$PYTHON" -m framework.coverage --format terminal --metric "$METRIC" \
              --min "$API_COVERAGE_MIN" --fail-on-unexpected
          else
            "$PYTHON" -m framework.coverage --format terminal --metric "$METRIC" \
              --fail-on-unexpected
          fi

      # 报告增强失败不改写 pytest 退出码（美化不该让业务用例变红），
      # 但会把错误写进 run_summary.json；这里显式检查，避免"报告没仪表盘却全绿"。
      - name: Verify report enhancement
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f reports/run_summary.json ]; then
            echo "未生成 run_summary.json（用例未运行），跳过"
            exit 0
          fi
          "$PYTHON" - <<'PY'
          import json, sys
          data = json.load(open('reports/run_summary.json', encoding='utf-8'))
          error = data.get('report_enhance_error')
          if error:
              print('[report-enhancer] 报告增强失败：%s' % error)
              sys.exit(1)
          print('[report-enhancer] 报告增强正常')
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-${{ github.event_name }}
          path: |
            reports/report.html
            reports/junit.xml
            reports/run_summary.json
            reports/api_coverage.md
            reports/api_coverage.json
            reports/known_defects.md
            reports/shopping_xfail_manifest.json
            reports/failed_requests/
          if-no-files-found: ignore
